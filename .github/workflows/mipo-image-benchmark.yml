name: MIPO image model benchmark
on:
  push:
    branches: [benchmark/mipo-image-20261115]
    paths: ['.github/workflows/mipo-image-benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    if: github.ref == 'refs/heads/benchmark/mipo-image-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openai==3.51.0 Pillow
      - name: Create fictional reference portrait
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          im = Image.new('RGB', (360, 460), '#ded1f3')
          d = ImageDraw.Draw(im)
          d.ellipse((78, 60, 283, 302), fill='#32253c')
          d.rounded_rectangle((64, 282, 296, 470), radius=65, fill='#256b64')
          d.ellipse((94, 95, 265, 286), fill='#c68261')
          d.pieslice((88, 56, 276, 210), 180, 360, fill='#32253c')
          for x in (123, 195):
              d.rounded_rectangle((x, 148, x+44, 186), radius=12, outline='#4f254d', width=5)
              d.ellipse((x+18, 158, x+26, 170), fill='#32253c')
          d.line((167, 164, 195, 164), fill='#4f254d', width=4)
          d.arc((149, 180, 212, 229), 10, 170, fill='#5f2a35', width=4)
          im.save('synthetic-reference.jpg', quality=92)
          PY
      - name: Compare three models on identical scenes
        env:
          OPENAI_API_KEY: ${{ secrets.MIPO_BENCHMARK_OPENAI_API_KEY }}
        run: python tests/image_model_benchmark.py synthetic-reference.jpg samples
      - name: Show request timings
        if: always()
        run: |
          if [ -f samples/timings.jsonl ]; then cat samples/timings.jsonl; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mipo-image-benchmark
          path: |
            synthetic-reference.jpg
            samples/
          retention-days: 7
