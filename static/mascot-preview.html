<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIPO — הדמות החדשה</title><link rel="stylesheet" href="/static/mascot.css?v=1"><style>
*{box-sizing:border-box}body{margin:0;background:#faf7ff;color:#342044;font-family:Arial,sans-serif;line-height:1.6}main{max-width:800px;margin:auto;padding:32px 20px;text-align:center}h1{margin-bottom:6px;font-size:30px}p{margin:8px 0 24px;color:#79668b}.stage{display:grid;place-items:center;background:#fff;border:1px solid #e5d8f3;border-radius:28px;padding:30px 18px;min-height:330px}.stage .mipoComic{width:230px;height:230px;flex-basis:230px}#caption{font-weight:bold;min-height:32px;margin:12px 0 0}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:24px 0}button,a{font:inherit;border-radius:14px;padding:12px 18px}button{cursor:pointer;border:1px solid #d9c6ee;color:#5f3585;background:#fff;min-height:48px}button[aria-pressed=true]{background:#7543d4;color:#fff;border-color:#7543d4}button:focus-visible,a:focus-visible{outline:3px solid #c89cff;outline-offset:3px}a{display:inline-block;color:#7543d4}small{display:block;color:#79668b} @media(max-width:400px){main{padding:24px 14px}.stage{min-height:300px}h1{font-size:26px}}
</style><script src="/static/mascot.js?v=1" defer></script><script src="/static/mascot-preview.js?v=1" defer></script></head><body><main><h1>הדמות החדשה של MIPO</h1><p>בחר תגובה כדי לראות את ההבעה והתנועה שלה.</p><section class="stage"><div id="actor"></div><div id="caption" aria-live="polite"></div></section><div class="choices"><button data-mood="peek" aria-pressed="true">החיוך השובב</button><button data-mood="miss" aria-pressed="false">אף אחד לא צדק</button><button data-mood="suspicious" aria-pressed="false">כולם טעו באותו ניחוש</button><button data-mood="correct" aria-pressed="false">קריצה למי שצדק</button><button data-mood="win" aria-pressed="false">חגיגת ניצחון</button></div><small>התנועות קצרות ושקטות. אפשר ללחוץ שוב כדי לראות אותן מחדש.</small><a href="/?new=1">למשחק MIPO ←</a></main></body></html>
