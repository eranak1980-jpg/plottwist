<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlotTwist — Know Your Crew</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b12;color:#fff;font-family:Arial,sans-serif}main{max-width:620px;margin:auto;padding:24px 16px 80px}.brand{font-weight:900;font-size:22px}.hero{padding:34px 0}.hero h1{font-size:44px;line-height:1;margin:12px 0}.hero em{color:#b69cff;font-style:normal}.muted{color:#aaa}.card{background:#15151f;border:1px solid #2c2c3d;border-radius:22px;padding:20px;margin:14px 0}.hidden{display:none!important}button,input{width:100%;border-radius:14px;padding:15px;font-size:16px;border:1px solid #343449;background:#20202d;color:#fff;margin:6px 0}button{font-weight:800;cursor:pointer}.primary{background:#7455ff;border-color:#8d75ff}.mini{width:auto;padding:10px 14px}.code{font-size:30px;letter-spacing:5px;font-weight:900}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.player{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #2a2a38}.q{font-size:27px;line-height:1.25;font-weight:900;margin:14px 0}.eyebrow{font-size:12px;letter-spacing:1px;color:#b69cff;font-weight:900}.choice{text-align:right}.choice.selected{outline:2px solid #b69cff}.reveal{text-align:center;background:linear-gradient(145deg,#342078,#15151f);padding:28px;border-radius:22px;margin:14px 0}.reveal .answer{font-size:32px;font-weight:900;margin:10px 0}.scene{font-size:70px;margin:12px}.score{font-size:24px;font-weight:900}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:12px 18px;border-radius:14px;font-weight:800;z-index:9}@media(max-width:480px){.hero h1{font-size:38px}.q{font-size:24px}}</style></head><body><main><div class="brand">PLOT<span style="color:#b69cff">TWIST</span></div><section id="home" class="hero"><span class="eyebrow">KNOW YOUR CREW</span><h1>מי באמת<br><em>מכיר את החבורה?</em></h1><p class="muted">אחד עונה בסוד. כולם מנחשים. ואז מגיע ה־Reveal.</p><div class="card"><button class="primary" onclick="mode('create')">צור משחק</button><button onclick="mode('join')">הצטרף למשחק</button></div></section><section id="create" class="card hidden"><h2>פותחים ערב</h2><input id="cname" placeholder="השם שלך"><button class="primary" onclick="createGame()">צור חדר</button></section><section id="join" class="card hidden"><h2>נכנסים לחבורה</h2><input id="jname" placeholder="השם שלך"><input id="jcode" placeholder="קוד חדר" maxlength="5"><button class="primary" onclick="joinGame()">הצטרף</button></section><section id="game" class="hidden"><div class="card"><div class="eyebrow">ROOM</div><div class="row"><div class="code" id="code"></div><button class="mini" onclick="share()">שתף לינק</button></div><div id="players"></div><div id="host"></div></div><div id="play" class="hidden"><div class="card"><div class="eyebrow" id="round"></div><div class="q" id="question"></div><p class="muted" id="instruction"></p><div id="choices"></div><div id="waiting" class="muted"></div></div><div id="reveal" class="reveal hidden"><div class="eyebrow">REVEAL</div><div class="scene" id="scene">🎭</div><div class="answer" id="answer"></div><p id="reaction">מי קרא את החבר שלו נכון?</p><button id="next" class="primary hidden" onclick="nextRound()">לשאלה הבאה →</button></div></div><div id="finish" class="card hidden"><span class="eyebrow">CREW REVEAL</span><h2>מי מכיר את החבורה הכי טוב?</h2><div id="scores"></div><button class="primary" onclick="location.href='/'">משחק חדש</button></div></section></main><div id="toast" class="toast hidden"></div><script>let s=JSON.parse(localStorage.getItem('kyc')||'{}'),loading=false;const $=x=>document.querySelector(x);function save(){localStorage.setItem('kyc',JSON.stringify(s))}function toast(x){let t=$('#toast');t.textContent=x;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}function mode(x){$('#home').classList.add('hidden');$('#create').classList.toggle('hidden',x!=='create');$('#join').classList.toggle('hidden',x!=='join')}async function req(p,b){let r=await fetch(p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):null,cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'error');return d}async function createGame(){try{s=await req('/api/create',{name:$('#cname').value});save();show()}catch(e){toast('צריך שם')}}async function joinGame(){try{s=await req('/api/join',{name:$('#jname').value,code:$('#jcode').value.toUpperCase()});save();show()}catch(e){toast(e.message==='started'?'המשחק כבר התחיל':'לא הצלחתי להצטרף')}}function show(){$('#home,#create,#join').forEach?.(()=>{});$('#home').classList.add('hidden');$('#create').classList.add('hidden');$('#join').classList.add('hidden');$('#game').classList.remove('hidden');load()}async function share(){let u=location.origin+'/?code='+s.code;try{if(navigator.share)await navigator.share({title:'PlotTwist',text:'בואו נראה מי באמת מכיר את החבורה',url:u});else{await navigator.clipboard.writeText(u);toast('הלינק הועתק')}}catch{}}async function load(){if(!s.code||loading)return;loading=true;try{render(await req('/api/state/'+s.code+'?token='+(s.token||'')+'&host='+(s.host||'')))}catch(e){}finally{loading=false}}function render(d){$('#code').textContent=d.code;$('#players').innerHTML=d.players.map(p=>'<div class="player"><b>'+p.name+'</b><span>'+p.score+' נק׳</span></div>').join('');$('#host').innerHTML='';if(d.status==='lobby'){if(d.is_host){$('#host').innerHTML='<button class="primary" id="start">'+(d.players.length<3?'מחכים לעוד '+(3-d.players.length)+' שחקנים':'מתחילים')+'</button>';$('#start').disabled=d.players.length<3;$('#start').onclick=start}$('#play').classList.add('hidden');return}if(d.status==='finished'){$('#play').classList.add('hidden');$('#finish').classList.remove('hidden');let a=[...d.players].sort((x,y)=>y.score-x.score);$('#scores').innerHTML=a.map((p,i)=>'<div class="player"><b>'+(i===0?'🏆 ':'')+p.name+'</b><span class="score">'+p.score+'</span></div>').join('');return}$('#play').classList.remove('hidden');$('#round').textContent='סיבוב '+(d.round+1)+' מתוך '+d.total;$('#question').textContent=d.question;let subject=d.me&&d.subject&&d.me.id===d.subject.id;$('#instruction').textContent=subject?(d.answered?'ענית. עכשיו אל תגלה — מחכים לניחושים.':'זו שאלה עליך. בחר תשובה בסוד.'):(d.guessed?'הניחוש שלך נשמר. מחכים לאחרים.':'מה לדעתך '+d.subject.name+' בחר/ה?');$('#choices').innerHTML='';if((subject&&!d.answered)||(!subject&&!d.guessed&&!d.reveal))d.options.forEach(o=>{let b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>pick(o,subject);$('#choices').appendChild(b)});$('#waiting').textContent=d.reveal?'':(d.answered?d.guess_count+' מתוך '+d.guess_need+' ניחשו':'');$('#reveal').classList.toggle('hidden',!d.reveal);if(d.reveal){$('#answer').textContent=d.answer;$('#scene').textContent=scene(d);$('#next').classList.toggle('hidden',!d.is_host);$('#reaction').textContent='💥 '+d.subject.name+' בחר/ה: '+d.answer}}function scene(d){let q=d.question;if(q.includes('אי בודד'))return'🏝️😎';if(q.includes('100,000'))return'💸✈️';if(q.includes('3 בלילה'))return'📱🌙';if(q.includes('עסק'))return'🤝💼';if(q.includes('מדינה'))return'🌍🧳';if(q.includes('סרט'))return'🎬🍿';return'🎭✨'}async function pick(o,subject){try{await req('/api/'+s.code+'/'+(subject?'answer':'guess'),{token:s.token,answer:o,guess:o});await load()}catch(e){toast('נסה שוב')}}async function start(){try{await req('/api/'+s.code+'/start',{host:s.host});await load()}catch(e){toast('צריך לפחות 3 שחקנים')}}async function nextRound(){try{await req('/api/'+s.code+'/next',{host:s.host});await load()}catch(e){toast('מחכים לכל הניחושים')}}let code=new URLSearchParams(location.search).get('code');if(code&&!s.code){mode('join');$('#jcode').value=code.toUpperCase()}else if(s.code)show();setInterval(load,1200);</script></body></html>
