<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game packages</title><style>body{margin:0;background:#faf7f1;color:#342541;font:17px system-ui,sans-serif}main{max-width:780px;margin:auto;padding:28px 20px}a{color:#6734ac}h1{font-size:34px}p{line-height:1.65}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fffdfa;border:1px solid #d9c8eb;border-radius:22px;padding:24px}.price{font-size:40px;font-weight:800;color:#703bc0}.badge{color:#6734ac;font-weight:700}label{display:block;margin:16px 0 8px}input,select{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #cbb2e5;border-radius:12px;background:white}output{display:block;font-size:28px;font-weight:800;margin-top:18px;color:#703bc0}.note{padding:16px;background:#efe6fa;border-radius:14px;font-size:15px}.muted{color:#74697f;font-size:14px}@media(max-width:520px){.cards{grid-template-columns:1fr}h1{font-size:28px}}</style></head><body><main><a href="/" id="back"></a><h1 id="title"></h1><p id="intro"></p><p class="note" id="pilot"></p><div class="cards"><section class="card"><h2 id="single"></h2><div class="price">$7.99</div><p class="included"></p></section><section class="card"><h2 id="duo"></h2><div class="price">$12.99</div><p class="included"></p></section></div><p id="trial"></p><section class="card"><h2 id="custom"></h2><label for="games" id="gamesLabel"></label><select id="games"><option value="1"></option><option value="2"></option></select><label for="rounds" id="roundsLabel"></label><input id="rounds" type="number" min="8" max="30" step="1" value="18"><output id="quote" aria-live="polite"></output><p id="extra" class="muted"></p></section><p id="features"></p><p class="muted" id="terms"></p></main><script>
const he=new URLSearchParams(location.search).get('lang')==='he';document.documentElement.lang=he?'he':'en';document.documentElement.dir=he?'rtl':'ltr';
const text=he?{back:'חזרה למשחק',title:'מארח אחד. כולם משחקים.',intro:'מחירי ההשקה שאושרו: תשלום לכל הקבוצה, בלי מנוי.',pilot:'ניסיון חינם כולל 8 שאלות. רכישה נפתחת דרך עמוד תשלום מאובטח כאשר הסליקה זמינה.',single:'משחק אחד',duo:'שני משחקים',included:'עד 18 שאלות בכל משחק · 2–6 משתתפים',trial:'ניסיון חינם: 8 שאלות, פעם אחת למארח.',custom:'בחרו את אורך המשחק',gamesLabel:'חבילה',roundsLabel:'מספר שאלות במשחק אחד (8–30)',extra:'הארכה קבועה ב־$2.99 מרחיבה משחק אחד מ־18 ל־30 שאלות. בחבילת שני משחקים היא חלה על משחק אחד בלבד.',features:'כל מצבי המשחק בהתאם לגיל ולהסכמה, תמונות AI ותמונת סיום. חזרה למשחק שנקטע אינה צורכת משחק נוסף.',terms:'המחירים בדולר ארה״ב. מסים, אם יחולו, יוצגו לפני התשלום.'}:{back:'Back to game',title:'One host. Everyone plays.',intro:'Approved launch pricing for the whole group. No subscription.',pilot:'The free trial includes 8 questions. Purchases open through secure checkout when payment is available.',single:'One game',duo:'Two games',included:'Up to 18 questions per game · 2–6 players',trial:'Free trial: 8 questions, once per host.',custom:'Choose your game length',gamesLabel:'Package',roundsLabel:'Questions in one game (8–30)',extra:'A fixed $2.99 extension expands one game from 18 to 30 questions. In the Two Games pack it applies to one game only.',features:'All age-appropriate, consensual modes, AI reveals and a final poster. Resuming an interrupted game does not use another game.',terms:'Prices in USD. Applicable taxes, if any, are shown before payment.'};for(const [id,value]of Object.entries(text)){if(id==='included')document.querySelectorAll('.included').forEach(e=>e.textContent=value);else document.getElementById(id).textContent=value}document.querySelector('#games option[value="1"]').textContent=text.single;document.querySelector('#games option[value="2"]').textContent=text.duo;
let request=0;async function update(){const ticket=++request,r=document.getElementById('rounds'),out=document.getElementById('quote');if(!r.checkValidity()){out.textContent=he?'בחרו מספר שלם בין 8 ל־30':'Choose a whole number from 8 to 30';return}try{const response=await fetch('/api/pricing?rounds='+r.value+'&games='+document.getElementById('games').value);if(!response.ok)throw Error();const q=await response.json();if(ticket===request)out.textContent=(he?'סה״כ: ':'Total: ')+new Intl.NumberFormat('en-US',{style:'currency',currency:q.currency}).format(q.total_cents/100)}catch(_){if(ticket===request)out.textContent=he?'לא ניתן לטעון מחיר כרגע':'Price unavailable right now'}}document.getElementById('rounds').oninput=update;document.getElementById('games').onchange=update;update();
</script></body></html>
