<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6c37d8"><title>MIPO Checkout</title><link rel="stylesheet" href="/static/landing.css?v=4"><style>main{min-height:100vh;display:grid;place-items:center;padding:24px}.checkout-card{width:min(520px,100%);background:#fff;border:1px solid #ded0f1;border-radius:24px;padding:30px;box-shadow:0 22px 60px #42159c18;text-align:center}.checkout-card img{width:150px;height:64px;object-fit:cover;border-radius:12px}.checkout-card h1{font-size:2rem;margin:20px 0 10px}.checkout-card p{color:#625a6e}.checkout-card .btn{width:100%;margin-top:12px}.spinner{width:34px;height:34px;border:4px solid #e4daf4;border-top-color:#6c37d8;border-radius:50%;margin:25px auto;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><main><section class="checkout-card"><img src="/static/branding/mipo-logo.png" alt="MIPO"><h1 id="title">Secure checkout</h1><p id="message">Preparing your PayPlus checkout…</p><div id="spinner" class="spinner" aria-hidden="true"></div><a id="action" class="btn btn-main" href="/play-mipo" hidden>Back to MIPO</a></section></main><script>
const path=location.pathname,params=new URLSearchParams(location.search),title=document.getElementById('title'),message=document.getElementById('message'),spinner=document.getElementById('spinner'),action=document.getElementById('action');
function readId(){try{let v=JSON.parse(localStorage.getItem('plot_device_id_safe')||'null');if(v)return v}catch(_){}let v=(crypto.randomUUID?crypto.randomUUID():'dev_'+Date.now()+'_'+Math.random().toString(36).slice(2));localStorage.setItem('plot_device_id_safe',JSON.stringify(v));return v}const client_id=readId();
function show(t,m,href,label){title.textContent=t;message.textContent=m;spinner.hidden=true;action.hidden=false;action.href=href;action.textContent=label}
async function start(){let product=params.get('product');if(!['one_game','two_games','extension'].includes(product))return show('Choose a MIPO game','Select a package on the pricing page.','/play-mipo#pricing','View pricing');try{let body={product,client_id};if(product==='extension'){let auth={};try{auth=JSON.parse(sessionStorage.getItem('mipo_extension_auth')||'{}')}catch(_){}body.code=auth.code;body.host=auth.host}let r=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'checkout_unavailable');location.replace(d.checkout_url)}catch(e){show('Checkout is not available yet',e.message==='checkout_not_configured'?'Payment credentials still need to be connected. No charge was made.':'We could not open secure checkout. No charge was made.','/play-mipo#pricing','Back to pricing')}}
async function result(){let state=path.split('/').pop(),order=params.get('order');if(state==='failure')return show('Payment failed','Your payment was not completed. You can try again safely.','/play-mipo#pricing','Try again');if(state==='cancel')return show('Checkout cancelled','No charge was completed.','/play-mipo#pricing','Back to pricing');if(!order)return show('Payment status unavailable','Open MIPO from the same browser you used for checkout.','/play-mipo','Back to MIPO');title.textContent='Confirming your purchase';message.textContent='Payment received. We’re securely unlocking your game…';for(let i=0;i<20;i++){try{let r=await fetch('/api/order/'+encodeURIComponent(order)+'?client_id='+encodeURIComponent(client_id),{cache:'no-store'}),d=await r.json();if(r.ok&&d.status==='paid')return show('Your MIPO game is ready','Your purchase is unlocked for this browser.','/?new=1','Create your game');if(r.ok&&d.status==='failed')return show('Payment was not completed','No game was unlocked.','/play-mipo#pricing','Try again')}catch(_){}await new Promise(r=>setTimeout(r,1500))}show('Still confirming','We have not received the verified payment confirmation yet. Refresh this page in a moment.','','Refresh');action.onclick=e=>{e.preventDefault();location.reload()}}
path==='/checkout'?start():result();
</script></body></html>
